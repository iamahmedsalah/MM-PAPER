    s.m.geometry.attributes.position.needsUpdate = true; s.m.geometry.computeVertexNormals();
    const y = 9 - ((s.y0 + t * s.spd) % 18);
    s.m.position.set(s.x + Math.sin(t * .5 + s.ph) * .6, y, s.z);
    s.m.rotation.set(t * s.rs * .6 + s.ph, t * s.rs * .45, t * s.rs * .3); s.m.scale.setScalar(Math.max(.001, s.sc * (s.back ? 1 - smooth(11, 12.4, t) : 1 - smooth(9.5, 10.8, t))));
  });
}

/* ---------- frame ---------- */
const tagEl = document.getElementById('tag'), line = tagEl.querySelector('i');
let fitD = 1;
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h;
  fitD = Math.max(1, 5.3 / (Math.tan(cam.fov * Math.PI / 360) * cam.aspect) / 11); cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

function frame(t) {
  t = clamp(t, 0, DUR + .01);
  strips.forEach(S => updateStrip(S, t)); updateSheets(t);
  const sway = 1 - smooth(11, 13, t);
  const az = keyed([[0, -.6], [5, -.28], [9, .32], [13, 0]], t) + .015 * Math.sin(t * .7) * sway;
  const el = keyed([[0, .1], [5, .06], [9, .12], [13, 0]], t) + .01 * Math.sin(t * .9) * sway;
  const D = keyed([[0, 14.5], [5, 13], [9, 12.4], [13, 12.2]], t) * fitD;
  cam.position.set(Math.sin(az) * Math.cos(el) * D, Math.sin(el) * D, Math.cos(az) * Math.cos(el) * D); cam.lookAt(0, 0, 0);
  gold.position.set(Math.sin(t * .8) * 7, Math.cos(t * .6) * 3 + 2, 5);
  const ta = smooth(10.6, 11.9, t);
  tagEl.style.opacity = ta; tagEl.style.letterSpacing = (.85 - .3 * ta) + 'em'; tagEl.style.transform = `translateY(${(1 - ta) * 10}px)`; line.style.width = (ta * 64) + 'px';
  renderer.render(scene, cam);
}
window.__frame = t => { frame(t); return true; };
window.__DUR = DUR; window.__ready = true;

if (!CAP) {
  let t0 = performance.now(); document.getElementById('replay').onclick = () => t0 = performance.now();
  renderer.setAnimationLoop(now => { const t = (now - t0) / 1000; if (t > DUR + 2) t0 = now; frame(Math.min(t, DUR)); });
} else frame(0);
</script></body></html>
